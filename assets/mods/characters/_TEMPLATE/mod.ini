; A character: a new driver and car, built on one of the game's cars (GUIDE.txt). tm2pc --new-mod character <id>
; makes a copy with its id and uid filled in; then change every other line.
[mod]
id = my-character
uid =
name = My Character
kind = character
version = 1.0
author =
game_version = 1
requires =

[character]
base = Spectre

; Its own numbers (GUIDE.txt, "Stats"): each line optional, the base car's number when left out. Remove the ';' to use one.
;top_speed = 120
;acceleration = 7
;brakes = 3
;turning = 80
;steering = 5
;slide_speed = 100
;armor = 100
;mass = 25
;track_width = 60
;front_axle = 55
;rear_axle = 65
;ride_height = 16
;roof_height = 32
;step_height = 60
;special = own              ; or warthog, homing_missile, ... (GUIDE.txt: The special)
;special_recharge = 700
;special_max = 4
;special_damage = 10
;special_speed = 100
;radar_color = 255, 128, 0
;team_paint = 16-47, 80     ; team games: these palette entries of car.tms's first picture take the team's color

[ai]
; Its computer driver (GUIDE.txt, "The computer driver"): each line optional, the base car's habit when left out.
;hunt = 50
;hunt_hurt = 30
;attack = 40
;attack_hurt = 60
;hunt_time = 600
;attack_time = 600
;flee_time = 600
;retaliate = 50
;pass = 50
;patience = 40
;fire_chance = 60
